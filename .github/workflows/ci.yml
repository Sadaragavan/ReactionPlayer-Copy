name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # Writes the self-contained page into dist/, replacing the build above.
      - name: Build the single-file version
        run: npm run build:single

      - name: Keep the single-file build
        uses: actions/upload-artifact@v4
        with:
          name: reaction-player-single-file
          path: dist/index.html
          retention-days: 14
